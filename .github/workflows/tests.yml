name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Typen, Format und Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Typprüfung
        run: npm run check
      - name: Format und Lint
        run: npm run lint
      - name: Unit-Tests
        run: npx vitest run

  # Der Rundlauf klickt sich durch die Anwendung (5.7). Er läuft gegen das **gebaute**
  # Artefakt und SQLite im Arbeitsspeicher, braucht also keine Datenbank als Service —
  # und er gehört in diesen Workflow, weil deploy.yml an dessen Gesamtergebnis hängt.
  e2e:
    name: Rundlauf durch die Anwendung
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Browser bereitstellen
        run: npx playwright install chromium --with-deps
      - name: Rundlauf
        run: npx playwright test

      - name: Spur bei Fehlschlag sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Die Vitest-Suite läuft über VITEST=true gegen SQLite im Arbeitsspeicher und fasst
  # damit weder `node build` noch den MariaDB-Zweig von startDB() an. Dieser Job startet
  # das gebaute Artefakt gegen eine echte MariaDB — genau so, wie der Supervisor es auf
  # dem Uberspace tut. Er gehört in DIESEN Workflow, weil deploy.yml per `workflow_run`
  # an dessen Gesamtergebnis hängt: Schlägt der Rauchtest fehl, wird nicht deployt.
  smoke:
    name: Rauchtest gegen MariaDB
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          # Der effektive Name ist MARIA_DB_USER + '_' + MARIA_DB_NAME (sequelize.ts).
          MARIADB_DATABASE: houses_prod
          MARIADB_USER: houses
          MARIADB_PASSWORD: housespw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0

      - name: Abhängigkeiten installieren
        run: npm ci

      # Mit vollen Abhängigkeiten bauen. Dieser Schritt allein fängt schon einen Guard
      # ab, der ohne MARIA_DB_*-Variablen auf Modulebene werfen würde.
      - name: Bauen
        run: npm run build

      # Wie auf dem Host: nur Produktionsabhängigkeiten. Steckt eine Laufzeitabhängigkeit
      # fälschlich in devDependencies, startet der Server ab hier nicht mehr.
      - name: Nur Produktionsabhängigkeiten installieren
        run: npm ci --omit=dev

      - name: MariaDB-Client bereitstellen
        run: command -v mysql || sudo apt-get install -y --no-install-recommends mariadb-client

      - name: Rauchtest
        run: bash scripts/smoke-test.sh

      - name: Serverlog bei Fehlschlag sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: smoke-server-log
          path: smoke-server.log
          retention-days: 7
