name: Deploy auf den Uberspace

on:
  workflow_run:
    workflows: ['Tests']
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy auf den Uberspace
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.20.0

      - name: Abhängigkeiten installieren
        run: npm ci

      # adapter-node erzeugt unter build/ einen eigenständigen Node-Server. Der wird
      # ausgeliefert und mit `node build` gestartet — kein `vite dev` auf dem Host.
      - name: Bauen
        run: npm run build

      # Die Produktionsdatenbank enthält Generationen von Spielzeit, die sich nicht
      # wiederherstellen lassen, und startDB() führt beim Start Migrationen aus. Der
      # Dump gehört deshalb VOR den Upload, nicht daneben.
      - name: Datenbank sichern
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.DEPLOY_KEY_PRIVATE }}
          script: |
            set -e
            mkdir -p "$HOME/backups/houses"
            ziel="$HOME/backups/houses/vor-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            # Zugangsdaten kommen aus ~/.my.cnf des Uberspace-Benutzers, stehen also
            # nicht im Workflow.
            mysqldump --single-transaction "${{ secrets.UBERSPACE_USER }}_houses" | gzip > "$ziel"
            echo "Sicherung: $ziel ($(du -h "$ziel" | cut -f1))"
            # Aufbewahrung: die letzten 14 Sicherungen bleiben liegen.
            ls -1t "$HOME/backups/houses"/vor-deploy-*.sql.gz | tail -n +15 | xargs -r rm --

      - name: rsync
        uses: burnett01/rsync-deployments@7.1.0
        with:
          # node_modules NICHT mitschicken: native Module (mariadb, sqlite3) hängen an
          # Plattform und ABI und werden auf dem Host installiert. build/ dagegen schon.
          # --exclude bewahrt die genannten Pfade auf dem Host vor --delete: Die .env
          # liegt nur dort, und die Sicherungen sollen einen Deploy überleben.
          switches: -avzr --delete --chmod=D755,F644 --exclude=".env" --exclude="node_modules" --exclude=".data"
          path: /
          # NICHT ~/html — das ist der Apache-Docroot, in dem ein anderes Projekt liegt.
          # Die App wird ohnehin von Node auf Port 5174 ausgeliefert, nicht von Apache;
          # im Docroot wäre nebenbei der komplette Quellbaum öffentlich lesbar.
          remote_path: /home/${{ secrets.UBERSPACE_USER }}/houses-app/
          remote_host: ${{ secrets.UBERSPACE_HOST }}
          remote_user: ${{ secrets.UBERSPACE_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY_PRIVATE }}

      # Produktionsabhängigkeiten installieren (läuft, während der alte Dienst noch
      # antwortet → keine spürbare Auszeit), dann neu starten.
      - name: Installieren, neu starten, Bereitschaft prüfen
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.UBERSPACE_HOST }}
          username: ${{ secrets.UBERSPACE_USER }}
          key: ${{ secrets.DEPLOY_KEY_PRIVATE }}
          script: |
            cd "$HOME/houses-app" || exit 1
            # Die .env liegt nur auf dem Host (gitignored, per --exclude geschützt) —
            # fehlt sie, startet `node --env-file=.env build` gar nicht erst. Vorher
            # prüfen, damit der Grund sofort dasteht statt erst nach dem Zeitlimit.
            if [ ! -f .env ]; then
              echo "FEHLER: $PWD/.env fehlt. Ohne sie startet der Dienst nicht."
              echo "Anlegen mit MARIA_DB_USER/MARIA_DB_PASSWORD/MARIA_DB_NAME, dann erneut deployen."
              exit 1
            fi
            # Nur `dependencies`: adapter-node hält sie extern, sie müssen also im
            # node_modules des Hosts liegen.
            npm ci --omit=dev
            # rsync setzt mit --chmod=D755,F644 **jede** Datei auf 644 — das Ausführbar-Bit
            # aus dem Repository überlebt den Upload nicht. Ohne diese Zeile scheitert der
            # Aufruf der Sicherungsskripte mit "Permission denied", obwohl die Datei
            # sichtbar da ist und im Repository 755 trägt.
            chmod +x scripts/*.sh
            # Der Supervisor-Dienst "houses" führt `npm run start-server` im
            # Verzeichnis ~/houses-app aus (~/etc/services.d/houses.ini).
            supervisorctl restart houses
            # Bereitschaft statt bloßer Erreichbarkeit: /api/health setzt ein SELECT ab,
            # meldet offene Migrationen und liest die Weltuhr. Ein curl gegen / lieferte
            # auch bei toter Datenbank eine Antwort — nämlich den Redirect zur Anmeldung.
            for i in $(seq 1 40); do
              if antwort=$(curl -fsS http://localhost:5174/houses/api/health); then
                echo "Dienst ist bereit (nach ~$((i * 3))s): $antwort"
                exit 0
              fi
              sleep 3
            done
            echo "Der Dienst wurde nach dem Neustart nicht bereit."
            echo "Letzte Antwort: $(curl -sS -o - -w ' [HTTP %{http_code}]' http://localhost:5174/houses/api/health || echo 'keine Verbindung')"
            echo "Details im Log: supervisorctl tail -100 houses"
            exit 1
